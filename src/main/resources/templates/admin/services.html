<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin">
                <i class="fas fa-clock me-2"></i>Easy-Q Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/appointments">
                    <i class="fas fa-calendar me-1"></i>Appointments
                </a>
                <a class="nav-link" href="/admin/queue-management">
                    <i class="fas fa-list-ol me-1"></i>Queue Management
                </a>
                <a class="nav-link" href="/admin/services">
                    <i class="fas fa-cog me-1"></i>Services
                </a>
                <a class="nav-link" href="/admin/users">
                    <i class="fas fa-users me-1"></i>Users
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h1><i class="fas fa-concierge-bell me-2"></i>Manage Services</h1>
                <a href="/admin" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div th:if="${services == null or services.isEmpty()}" class="text-center py-5">
                    <i class="fas fa-concierge-bell fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No Services Found</h5>
                    <p class="text-muted">There are no services configured yet.</p>
                </div>

                <div th:if="${services != null and !services.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Service Name</th>
                                    <th>Description</th>
                                    <th>Duration</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="service : ${services}">
                                    <td th:text="${service.id}">-</td>
                                    <td>
                                        <strong th:text="${service.name}">-</strong>
                                    </td>
                                    <td>
                                        <span th:if="${service.description != null and !service.description.isEmpty()}" 
                                              th:text="${#strings.abbreviate(service.description, 50)}" 
                                              class="text-muted">-</span>
                                        <span th:unless="${service.description != null and !service.description.isEmpty()}" 
                                              class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${service.durationMinutes + ' min'}">-</span>
                                    </td>
                                    <td>
                                        <span th:if="${service.price != null}" 
                                              th:text="${'$' + #numbers.formatDecimal(service.price, 0, 2)}" 
                                              class="fw-bold text-success">-</span>
                                        <span th:unless="${service.price != null}" class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${service.isActive} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${service.isActive ? 'Active' : 'Inactive'}">-</span>
                                    </td>
                                    <td th:text="${#temporals.format(service.createdAt, 'yyyy-MM-dd')}">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
