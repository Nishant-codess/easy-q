<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Queue Management - Easy-Q</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-clock me-2"></i>Easy-Q Admin
            </a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin">
                    <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                </a>
                <a class="nav-link" href="/queue">
                    <i class="fas fa-list-ol me-1"></i>User Queue
                </a>
                <a class="nav-link" href="/booking">
                    <i class="fas fa-calendar-plus me-1"></i>Bookings
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="h2 text-primary">
                    <i class="fas fa-cogs me-2"></i>Queue Management
                </h1>
                <p class="text-muted">Manage the queue and serve customers</p>
            </div>
        </div>

        <!-- Queue Statistics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body text-center">
                        <h4 id="waitingCount">0</h4>
                        <small>Waiting</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body text-center">
                        <h4 id="calledCount">0</h4>
                        <small>Called</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body text-center">
                        <h4 id="inProgressCount">0</h4>
                        <small>In Progress</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body text-center">
                        <h4 id="completedCount">0</h4>
                        <small>Completed</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Service Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="serviceFilter" class="form-label">Filter by Service:</label>
                <select class="form-select" id="serviceFilter">
                    <option value="">All Services</option>
                    <option th:each="service : ${services}" 
                            th:value="${service.id}" 
                            th:text="${service.name}">
                        Service Name
                    </option>
                </select>
            </div>
        </div>

        <!-- Queue Table -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-list me-2"></i>Current Queue
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Queue #</th>
                                <th>Customer</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Wait Time</th>
                                <th>Joined At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody">
                            <tr th:each="entry : ${queueEntries}">
                                <td th:text="${entry.queueNumber}">1</td>
                                <td th:text="${entry.userName}">John Doe</td>
                                <td th:text="${entry.serviceName}">Consultation</td>
                                <td>
                                    <span th:class="'badge ' + ${entry.status == 'WAITING' ? 'bg-warning' : 
                                                      entry.status == 'CALLED' ? 'bg-info' : 
                                                      entry.status == 'IN_PROGRESS' ? 'bg-primary' : 'bg-success'}"
                                          th:text="${entry.status}">WAITING</span>
                                </td>
                                <td th:text="${entry.estimatedWaitTime} + ' min'">15 min</td>
                                <td th:text="${#temporals.format(entry.createdAt, 'HH:mm')}">10:30</td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <button th:if="${entry.status == 'WAITING'}" 
                                                class="btn btn-info btn-sm" 
                                                th:onclick="'callNext(' + ${entry.service.id} + ')'">
                                            <i class="fas fa-bullhorn"></i> Call
                                        </button>
                                        <button th:if="${entry.status == 'CALLED'}" 
                                                class="btn btn-primary btn-sm" 
                                                th:onclick="'startService(' + ${entry.id} + ')'">
                                            <i class="fas fa-play"></i> Start
                                        </button>
                                        <button th:if="${entry.status == 'IN_PROGRESS'}" 
                                                class="btn btn-success btn-sm" 
                                                th:onclick="'completeService(' + ${entry.id} + ')'">
                                            <i class="fas fa-check"></i> Complete
                                        </button>
                                        <button class="btn btn-danger btn-sm" 
                                                th:onclick="'removeEntry(' + ${entry.id} + ')'">
                                            <i class="fas fa-times"></i> Remove
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SockJS and STOMP for real-time updates -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <script>
        // WebSocket connection for real-time updates
        let stompClient = null;
        
        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                stompClient.subscribe('/topic/queue', function (message) {
                    const update = JSON.parse(message.body);
                    console.log('Queue update received:', update);
                    // Refresh the page to show latest data
                    location.reload();
                });
            });
        }
        
        // Call next person in queue
        function callNext(serviceId) {
            fetch('/queue/call-next', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `serviceId=${serviceId}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.queueNumber) {
                    alert(`Called queue number ${data.queueNumber}`);
                    location.reload();
                } else {
                    alert('Error calling next person');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred');
            });
        }
        
        // Start service for a queue entry
        function startService(queueEntryId) {
            fetch(`/queue/start/${queueEntryId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.queueNumber) {
                    alert(`Started service for queue number ${data.queueNumber}`);
                    location.reload();
                } else {
                    alert('Error starting service');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred');
            });
        }
        
        // Complete service for a queue entry
        function completeService(queueEntryId) {
            fetch(`/queue/complete/${queueEntryId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.queueNumber) {
                    alert(`Completed service for queue number ${data.queueNumber}`);
                    location.reload();
                } else {
                    alert('Error completing service');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred');
            });
        }
        
        // Remove queue entry
        function removeEntry(queueEntryId) {
            if (confirm('Are you sure you want to remove this queue entry?')) {
                fetch(`/queue/remove/${queueEntryId}`, {
                    method: 'POST'
                })
                .then(response => response.text())
                .then(data => {
                    alert('Queue entry removed successfully');
                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred');
                });
            }
        }
        
        // Update statistics
        function updateStatistics() {
            const entries = document.querySelectorAll('#queueTableBody tr');
            let waiting = 0, called = 0, inProgress = 0, completed = 0;
            
            entries.forEach(row => {
                const statusBadge = row.querySelector('.badge');
                if (statusBadge) {
                    const status = statusBadge.textContent.trim();
                    if (status === 'WAITING') waiting++;
                    else if (status === 'CALLED') called++;
                    else if (status === 'IN_PROGRESS') inProgress++;
                    else if (status === 'COMPLETED') completed++;
                }
            });
            
            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('calledCount').textContent = called;
            document.getElementById('inProgressCount').textContent = inProgress;
            document.getElementById('completedCount').textContent = completed;
        }
        
        // Initialize
        connect();
        updateStatistics();
        
        // Filter by service
        document.getElementById('serviceFilter').addEventListener('change', function() {
            const serviceId = this.value;
            if (serviceId) {
                // In a real app, you would filter the table here
                // For simplicity, we'll just reload with the filter
                window.location.href = `/queue/admin?serviceId=${serviceId}`;
            } else {
                window.location.href = '/queue/admin';
            }
        });
    </script>
</body>
</html>
