<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin">
                <i class="fas fa-clock me-2"></i>Easy-Q Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/appointments">
                    <i class="fas fa-calendar me-1"></i>Appointments
                </a>
                <a class="nav-link" href="/admin/queue-management">
                    <i class="fas fa-list-ol me-1"></i>Queue Management
                </a>
                <a class="nav-link" href="/admin/services">
                    <i class="fas fa-cog me-1"></i>Services
                </a>
                <a class="nav-link" href="/admin/users">
                    <i class="fas fa-users me-1"></i>Users
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h1><i class="fas fa-users me-2"></i>Manage Users</h1>
                <a href="/admin" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div th:if="${users == null or users.isEmpty()}" class="text-center py-5">
                    <i class="fas fa-users fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No Users Found</h5>
                    <p class="text-muted">There are no users registered yet.</p>
                </div>

                <div th:if="${users != null and !users.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">-</td>
                                    <td>
                                        <strong th:text="${user.username}">-</strong>
                                    </td>
                                    <td th:text="${user.firstName + ' ' + user.lastName}">-</td>
                                    <td th:text="${user.email}">-</td>
                                    <td>
                                        <span th:if="${user.phone != null and !user.phone.isEmpty()}" 
                                              th:text="${user.phone}">-</span>
                                        <span th:unless="${user.phone != null and !user.phone.isEmpty()}" 
                                              class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 
                                                              (${user.role.name() == 'STAFF'} ? 'bg-warning' : 'bg-primary')"
                                              th:text="${user.role}">-</span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${user.isActive} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${user.isActive ? 'Active' : 'Inactive'}">-</span>
                                    </td>
                                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
