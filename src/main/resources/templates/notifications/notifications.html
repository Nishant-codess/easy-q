<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - EasyQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">
                    <i class="bi bi-bell"></i> Notifications
                </h2>
                
                <!-- Notification Stats -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title">Total Notifications</h5>
                                <h3 th:text="${notifications.size()}">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">Sent</h5>
                                <h3 th:text="${#lists.size(notifications.?[isSent == true])}">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h5 class="card-title">Pending</h5>
                                <h3 th:text="${#lists.size(notifications.?[isSent == false])}">0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notifications List -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Recent Notifications</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${notifications.empty}" class="text-center py-4">
                            <i class="bi bi-bell-slash display-4 text-muted"></i>
                            <p class="text-muted mt-2" th:if="${error == null}">No notifications found</p>
                            <p class="text-warning mt-2" th:if="${error != null}" th:text="${error}">Error message</p>
                        </div>
                        
                        <div th:unless="${notifications.empty}" class="list-group">
                            <div th:each="notification : ${notifications}" 
                                 class="list-group-item d-flex justify-content-between align-items-start"
                                 th:classappend="${notification.isSent} ? 'list-group-item-success' : 'list-group-item-warning'">
                                <div class="ms-2 me-auto">
                                    <div class="fw-bold" th:text="${notification.title}">Title</div>
                                    <p class="mb-1" th:text="${notification.message}">Message</p>
                                    <small class="text-muted">
                                        <span th:text="${notification.type}">Type</span> • 
                                        <span th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                                        <span th:if="${notification.sentAt}" class="text-success">
                                            • Sent: <span th:text="${#temporals.format(notification.sentAt, 'HH:mm')}">Time</span>
                                        </span>
                                    </small>
                                </div>
                                <span class="badge rounded-pill" 
                                      th:classappend="${notification.isSent} ? 'bg-success' : 'bg-warning'"
                                      th:text="${notification.isSent} ? 'Sent' : 'Pending'">Status</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Test Notification Form -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">Send Test Notification</h5>
                    </div>
                    <div class="card-body">
                        <form id="testNotificationForm">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="type" class="form-label">Type</label>
                                    <select class="form-select" id="type" name="type" required>
                                        <option value="APPOINTMENT_REMINDER">Appointment Reminder</option>
                                        <option value="QUEUE_UPDATE">Queue Update</option>
                                        <option value="APPOINTMENT_CONFIRMATION">Appointment Confirmation</option>
                                        <option value="QUEUE_CALLED">Queue Called</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="message" class="form-label">Message</label>
                                    <input type="text" class="form-control" id="message" name="message" 
                                           placeholder="Enter test message" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">&nbsp;</label>
                                    <button type="submit" class="btn btn-primary d-block w-100">Send Test</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('testNotificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);
            
            fetch('/notifications/api/send-test?' + params.toString(), {
                method: 'POST'
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert('Error: ' + error);
            });
        });
    </script>
</body>
</html>
