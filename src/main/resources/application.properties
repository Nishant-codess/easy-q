# Server Configuration
server.port=8083
server.servlet.context-path=/

# Database Configuration - Using H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# WebSocket Configuration
spring.websocket.stomp.relay.enabled=false

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Notification Configuration (Placeholders)
notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
notification.twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}

notification.smtp.host=${SMTP_HOST:smtp.gmail.com}
notification.smtp.port=${SMTP_PORT:587}
notification.smtp.username=${SMTP_USERNAME:your_email@gmail.com}
notification.smtp.password=${SMTP_PASSWORD:your_app_password}
notification.smtp.auth=${SMTP_AUTH:true}
notification.smtp.starttls=${SMTP_STARTTLS:true}

# Logging Configuration
logging.level.com.easyq=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Management/Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
