# Server Configuration
server.port=8083
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}

# H2 Console (for development only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# WebSocket Configuration
spring.websocket.stomp.relay.enabled=false

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# Notification Configuration - REAL EMAIL & SMS
# SMS - Disabled for now, using Gmail only

# SMTP Configuration
notification.smtp.host=${SMTP_HOST:smtp.gmail.com}
notification.smtp.port=${SMTP_PORT:587}
notification.smtp.username=${SMTP_USERNAME:}
notification.smtp.password=${SMTP_PASSWORD:}
notification.smtp.auth=${SMTP_AUTH:true}
notification.smtp.starttls=${SMTP_STARTTLS:true}

# Feature Flags - EMAIL ONLY
notification.email.enabled=${NOTIF_EMAIL_ENABLED:true}
notification.sms.enabled=${NOTIF_SMS_ENABLED:false}

# Notification Settings
notification.retry.max-attempts=${NOTIF_RETRY_MAX:3}
notification.retry.delay-minutes=${NOTIF_RETRY_DELAY:5}
notification.appointment.reminder-hours=${NOTIF_APPOINTMENT_REMINDER_HOURS:24}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}

# Logging Configuration
logging.level.com.easyq=${LOG_LEVEL_EASYQ:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# Management/Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
